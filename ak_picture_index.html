function showToast(msg) {
  const el = document.getElementById("toast");
  if (!el) return;
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => el.classList.remove("show"), 2200);

async function loadFolderCacheFile() {
  if (FOLDER_CACHE) return FOLDER_CACHE;

  // act_folder_cache.json은 ReScan에서 다음과 같은 래퍼 구조로 저장될 수 있습니다.
  // { version, rootFolderName, selectedPath, updatedAt, cache: { "root::폴더명": {...} } }
  // 과거 버전에서는 cache 자체가 최상위 객체였기 때문에 두 형식을 모두 지원합니다.
  const normalizeCache = parsed => {
    if (!parsed || typeof parsed !== "object") return null;
    if (parsed.cache && typeof parsed.cache === "object") return parsed.cache;

    // rootFolderName + node 형식도 직접 캐시로 사용할 수 있게 지원
    if (parsed.node && parsed.rootFolderName) {
      const key = getFolderCacheKey(parsed.rootFolderName);
      return { [key]: parsed };
    }

    return parsed;
  };

  // Local web-server mode: HTML과 같은 폴더의 JSON을 최우선으로 읽습니다.
  try {
    const res = await fetch(FOLDER_CACHE_FILE + "?t=" + Date.now(), { cache: "no-store" });
    if (res.ok) {
      const parsed = await res.json();
      const normalized = normalizeCache(parsed);
      if (normalized && typeof normalized === "object") {
        FOLDER_CACHE = normalized;
        return FOLDER_CACHE;
      }
    }
  } catch (e) {
    console.warn("act_folder_cache.json load failed", e);
  }

  // 같은 브라우저의 마지막 저장본을 fallback으로 사용합니다.
  try {
    const raw = localStorage.getItem("ak_folder_cache_v1");
    if (raw) {
      const normalized = normalizeCache(JSON.parse(raw));
      if (normalized && typeof normalized === "object") {
        FOLDER_CACHE = normalized;
        return FOLDER_CACHE;
      }
    }
  } catch (e) {}

  FOLDER_CACHE = {};
  return FOLDER_CACHE;
}

function getFolderCacheKey(rootName) {
  return "root::" + String(rootName || "").trim().toLowerCase();
}

function findCachedFolder(cacheNode, pathEnc) {
  if (!cacheNode) return null;
  const target = String(pathEnc || "").replace(/\\/g, "/");
  const walk = n => {
    if (!n) return null;
    if (String(n.pathEnc || "").replace(/\\/g, "/") === target) return n;
    for (const c of (n.children || [])) {
      const hit = walk(c); if (hit) return hit;
    }
    return null;
  };
  return walk(cacheNode);
}

function snapshotImgCacheNode(node) {
  if (!node) return null;
  const cached = node._cachedInfo || null;
  const cachedCount = cached && Number.isFinite(Number(cached.count)) ? Number(cached.count) : 0;
  const cachedDirect = cached && Number.isFinite(Number(cached.directCount)) ? Number(cached.directCount) : null;
  const hasConfirmedCount = node._countConfirmed === true || node._filesLoaded === true;
  const directKnown = node._directCountConfirmed === true;
  const directCount = directKnown
    ? (Number.isFinite(Number(node._directImgCount)) ? Number(node._directImgCount) : 0)
    : (cachedDirect != null ? cachedDirect : null);

  const children = (node.children || []).map(snapshotImgCacheNode).filter(Boolean);
  const childTotal = children.reduce((sum, c) => sum + (Number(c.count) || 0), 0);
  // 상위 폴더 count는 항상 '직접 파일 수 + 모든 자식 폴더 count 합계'입니다.
  // 구형 JSON에는 directCount가 없으므로 기존 count에서 자식 합계를 빼서 직접 파일 수를 복원합니다.
  const resolvedDirect = directCount != null
    ? directCount
    : Math.max(0, cachedCount - childTotal);
  const count = resolvedDirect + childTotal;

  return {
    name: node.name || node.label || "",
    pathEnc: node.pathEnc || "./",
    count,
    directCount: resolvedDirect,
    hasSubfolders: children.length > 0 || node._hasSubfolders === true || cached?.hasSubfolders === true,
    favorite: !!node.favorite,
    children
  };
}

function getCurrentRootCache() {
  if (!imgSearchRoot) return null;
  const key = getFolderCacheKey(imgSearchRoot.name);
  return {
    key,
    updated: new Date().toISOString().slice(0, 19),
    rootLabel: imgSearchRoot.name || "",
    rootPathEnc: "./",
    node: snapshotImgCacheNode(imgSearchRoot)

}

function applyCachedNodeInfo(node, cached, includeChildren=true) {
  if (!node || !cached) return;
  if (Number.isFinite(Number(cached.count))) node.imgCount = Number(cached.count);
  if (Number.isFinite(Number(cached.directCount))) {
    node._directImgCount = Number(cached.directCount);
    node._directCountConfirmed = false;
  }
  if (typeof cached.hasSubfolders === "boolean") {
    node._hasSubfolders = cached.hasSubfolders;
    node._hasSubfoldersChecked = true;
  }
  if (typeof cached.favorite === "boolean") node.favorite = cached.favorite;
  if (!includeChildren || !Array.isArray(cached.children)) return;

  // 캐시의 children 전체를 재귀적으로 트리 노드로 복원합니다.
  // 기존 코드는 root의 1단계 자식만 placeholder로 만들어서,
  // JSON에 저장된 2단계 이하의 폴더와 파일 건수가 화면에 나타나지 않았습니다.
  const existing = new Map((node.children || []).map(c => [String(c.pathEnc || c.key), c]));
  const makeCachedNode = (c, parentPath) => {
    const rawPath = String(c.pathEnc || "");
    const path = rawPath
      ? (rawPath.endsWith("/") ? rawPath : rawPath + "/")
      : (parentPath + String(c.name || "") + "/");
    const old = existing.get(path);
    const child = old || {
      key: path,
      name: c.name || path.split("/").filter(Boolean).pop() || "",
      label: c.name || path.split("/").filter(Boolean).pop() || "",
      pathEnc: path,
      files: [], _fileHandles: [], children: [],
      isRoot: false, _filesLoaded: false, _structureLoaded: false,
      _needsScan: true, _hasSubfolders: false, _hasSubfoldersChecked: false,
      _cached: true, _handle: null, favorite: false
    };
    child.key = path;
    child.pathEnc = path;
    child.name = c.name || child.name;
    child.label = child.name;
    child._cached = true;
    child._cachedInfo = c;
    child._needsScan = !child._handle;
    child._hasSubfolders = c.hasSubfolders === true;
    child._hasSubfoldersChecked = typeof c.hasSubfolders === "boolean";
    child.favorite = !!c.favorite;
    child.imgCount = Number.isFinite(Number(c.count)) ? Number(c.count) : 0;
    child._directImgCount = Number.isFinite(Number(c.directCount)) ? Number(c.directCount) : null;
    child._directCountConfirmed = false;
    child._countConfirmed = false;

    const cachedChildren = Array.isArray(c.children) ? c.children : [];
    const previous = new Map((child.children || []).map(x => [String(x.pathEnc || x.key), x]));
    child.children = cachedChildren.map(cc => {
      const saved = existing.get(String(cc.pathEnc || "")) || previous.get(String(cc.pathEnc || ""));
      if (saved) {
        // 실제 handle이 이미 있는 경우 handle은 보존하면서 캐시 정보만 갱신합니다.
        const merged = makeCachedNode(cc, path);
        if (saved._handle) merged._handle = saved._handle;
        return merged;
      }
      return makeCachedNode(cc, path);
    });
    return child;
  };

  node.children = cached.children.map(c => makeCachedNode(c, node.pathEnc || "./"));
  node.children.sort((a,b) => String(a.name).localeCompare(String(b.name), "ja"));
  const cachedChildTotal = node.children.reduce((sum, c) => sum + countImgAll(c), 0);
  const cachedDirect = Number.isFinite(Number(cached.directCount))
    ? Number(cached.directCount)
    : Math.max(0, (Number(cached.count) || 0) - cachedChildTotal);
  node._directImgCount = cachedDirect;
  node._directCountConfirmed = false;
  node.imgCount = cachedDirect + cachedChildTotal;
  node._hasSubfolders = node.children.length > 0 || node._hasSubfolders === true;
  node._hasSubfoldersChecked = true;
}

function applyFolderCacheToRoot(root) {
  if (!root) return false;
  const key = getFolderCacheKey(root.name);
  let cached = FOLDER_CACHE && FOLDER_CACHE[key];
  // legacy cache compatibility: an older file may have stored the root under "act".
  if (!cached && FOLDER_CACHE && FOLDER_CACHE.act) cached = FOLDER_CACHE.act;
  if (!cached) return false;
  const info = cached.node || cached;
  applyCachedNodeInfo(root, info, true);
  return true;
}

    const oldRootCache = FOLDER_CACHE[cacheKey]?.node || FOLDER_CACHE[cacheKey] || null;

    const normalizePath = p => String(p || "").replace(/\\/g, "/").replace(/\/+/g, "/");
    const oldChildrenMap = old => new Map((old?.children || []).map(c => [normalizePath(c.pathEnc), c]));

    const makeSnapshot = (node, old) => {
      if (!node) return old || null;
      const oldCount = Number.isFinite(Number(old?.count)) ? Number(old.count) : 0;
      const oldDirect = Number.isFinite(Number(old?.directCount)) ? Number(old.directCount) : null;
      const confirmed = node._countConfirmed === true || node._filesLoaded === true;
      const directKnown = node._directCountConfirmed === true;
      const liveDirect = directKnown
        ? (Number.isFinite(Number(node._directImgCount)) ? Number(node._directImgCount) : 0)
        : (oldDirect != null ? oldDirect : null);

      const oldKids = oldChildrenMap(old);
      const liveKids = Array.isArray(node.children) ? node.children : [];
      const liveKeys = new Set(liveKids.map(c => normalizePath(c.pathEnc)));
      const children = [];

      // 현재 메모리에 존재하는 폴더는 현재 상태를 저장하고,
      // 아직 메모리에 만들어지지 않은 기존 캐시 폴더는 기존 정보를 보존합니다.
      for (const child of liveKids) {
        const key = normalizePath(child.pathEnc);
        children.push(makeSnapshot(child, oldKids.get(key)));
      }
      for (const [key, oldChild] of oldKids) {
        if (!liveKeys.has(key)) children.push(oldChild);
      }
      children.sort((a,b) => String(a.name || "").localeCompare(String(b.name || ""), "ja"));
      const childTotal = children.reduce((sum, c) => sum + (Number(c.count) || 0), 0);
      const directCount = liveDirect != null ? liveDirect : Math.max(0, oldCount - childTotal);
      const count = directCount + childTotal;

      return {
        name: node.name || node.label || old?.name || "",
        pathEnc: node.pathEnc || old?.pathEnc || "./",
        count,
        directCount,
        hasSubfolders: children.length > 0 || node._hasSubfolders === true || old?.hasSubfolders === true,
        favorite: !!node.favorite,
        children
      };
    };

    const mergedRootSnapshot = makeSnapshot(root, oldRootCache);

    FOLDER_CACHE[cacheKey] = {
      updated: now,
      rootLabel: root.name || "",
      rootPathEnc: "./",
      node: mergedRootSnapshot
    };

    // localStorage에도 같은 최종 데이터를 저장합니다.
    saveFolderCacheLocal();

    const cachePayload = {
      version: 4,
      rootFolderName: root.name || "",
      selectedPath: imgPictureSettings.selectedPath || "./",
      updatedAt: now,
      cache: FOLDER_CACHE
    };

    const settingsPayload = {
      version: IMG_SETTINGS_VERSION,
      treeWidth: Math.round(Number(imgPictureSettings.treeWidth) || 300),
      fileListWidth: Math.max(20, Math.min(80, Number(imgPictureSettings.fileListWidth) || 45)),
      viewMode: imgPictureSettings.viewMode === "list" ? "list" : "thumb",
      thumbSize: Math.round(Number(imgPictureSettings.thumbSize) || 160),
      listSize: Math.round(Number(imgPictureSettings.listSize) || 160),
      selectedPath: imgPictureSettings.selectedPath || "./",
      rootFolderName: root.name || window.__imgRootHandle?.name || "",
      uiLang: imgPictureSettings.uiLang === "ja" ? "ja" : "ko",
      favoriteFolders: JSON.parse(JSON.stringify(imgPictureSettings.favoriteFolders || {})),
      treeCollapsed: JSON.parse(JSON.stringify(window.__imgTreeCollapsed || { act: {} })),
      updatedAt: now
    };

    downloadJsonFile(FOLDER_CACHE_FILE, cachePayload);
    setTimeout(() => downloadJsonFile(IMG_SETTINGS_FILE, settingsPayload), 250);

    try {
      localStorage.setItem("ak_picture_settings_v1", JSON.stringify(settingsPayload));
    } catch (e) {}

    if (window.__imgRootHandle) await saveImgRootHandle(window.__imgRootHandle);

    showToast(tr("saveDone"));
  } catch (e) {
    console.error(e);
    showToast(tr("saveFail", {msg:e?.message || e}));
  }
}

function getGlobalLightbox() {
  if (window.__globalLb) return window.__globalLb;

  const lb = document.getElementById("globalLightbox");
  const img = document.getElementById("globalLbImg");
  const stage = document.getElementById("globalLbStage");
  const btnClose = document.getElementById("globalLbClose");
  const btnPrev = document.getElementById("globalLbPrev");
  const btnNext = document.getElementById("globalLbNext");
  const meta = document.getElementById("globalLbMeta");
  if (!lb || !img) {
    return { open() {}, close() {}, isOpen() { return false; }, prev() {}, next() {}, zoomBy() {} };
  }

  let list = [];
  let index = 0;
  let scale = 1;
  let baseW = 0, baseH = 0;
  const MIN_SCALE = 0.4, MAX_SCALE = 10;
  let active = false, drag = null, dragged = false;

  function calcBaseSize() {
    const nw = img.naturalWidth || 0, nh = img.naturalHeight || 0;
    if (!nw || !nh) { baseW = baseH = 0; return; }
    const maxW = window.innerWidth * 0.95;
    const maxH = window.innerHeight * 0.90;
    const fit = Math.min(maxW / nw, maxH / nh, 1);
    baseW = Math.max(1, Math.round(nw * fit));
    baseH = Math.max(1, Math.round(nh * fit));
  }

  function applyScale() {
    if (!baseW || !baseH) {
      if (img.naturalWidth) calcBaseSize();
    }
    if (!baseW || !baseH) return;
    img.style.maxWidth = "none";
    img.style.maxHeight = "none";
    img.style.width = Math.round(baseW * scale) + "px";
    img.style.height = Math.round(baseH * scale) + "px";
  }

  function centerScroll() {
    requestAnimationFrame(() => {
      lb.scrollLeft = Math.max(0, (lb.scrollWidth - lb.clientWidth) / 2);
      lb.scrollTop = Math.max(0, (lb.scrollHeight - lb.clientHeight) / 2);
    });
  }

  function updateMeta() {
    if (!meta) return;
    if (!list.length) { meta.textContent = ""; return; }
    meta.textContent = `${index + 1} / ${list.length} · ${Math.round(scale * 100)}%`;
  }

  function show(i) {
    if (!list.length) return;
    index = (i + list.length) % list.length;
    scale = 1;
    baseW = baseH = 0;
    active = true;
    lb.classList.add("open");
    document.body.style.overflow = "hidden";
    img.onload = () => {
      calcBaseSize();
      applyScale();
      centerScroll();
      updateMeta();
    };
    img.src = list[index];
    img.alt = "";
    updateMeta();
  }

  function open(urls, i) {
    list = Array.isArray(urls) ? urls.filter(Boolean) : [];
    if (!list.length) return;
    show(i || 0);
  }

  function close() {
    active = false;
    lb.classList.remove("open");
    document.body.style.overflow = "";
    img.removeAttribute("src");
  }

  function isOpen() { return active && lb.classList.contains("open"); }
  function prev() { if (list.length > 1) show(index - 1); }
  function next() { if (list.length > 1) show(index + 1); }

  function zoomBy(delta, clientX, clientY) {
    const prevScale = scale;
    const factor = delta > 0 ? 1.15 : 1 / 1.15;
    const nextScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
    if (Math.abs(nextScale - prevScale) < 0.001) return;
    scale = nextScale;

    const rect = lb.getBoundingClientRect();
    const mx = typeof clientX === "number" ? clientX - rect.left : rect.width / 2;
    const my = typeof clientY === "number" ? clientY - rect.top : rect.height / 2;
    const cx = mx + lb.scrollLeft, cy = my + lb.scrollTop;
    const ratio = scale / prevScale;

    applyScale();
    updateMeta();
    requestAnimationFrame(() => {
      lb.scrollLeft = cx * ratio - mx;
      lb.scrollTop = cy * ratio - my;
    });
  }

  btnClose && btnClose.addEventListener("click", e => { e.stopPropagation(); close(); });
  btnPrev && btnPrev.addEventListener("click", e => { e.stopPropagation(); prev(); });
  btnNext && btnNext.addEventListener("click", e => { e.stopPropagation(); next(); });

  lb.addEventListener("click", e => {
    if (dragged) { dragged = false; return; }
    if (e.target === lb || e.target === stage) close();
  });
  img.addEventListener("click", e => e.stopPropagation());

  // 확대 이미지 더블클릭: 100% 비율로 복귀
  img.addEventListener("dblclick", e => {
    if (!isOpen()) return;
    e.preventDefault();
    e.stopPropagation();
    scale = 1;
    applyScale();
    updateMeta();
    centerScroll();
  });

  // 확대창에서는 Ctrl 없이 일반 마우스 휠만 움직여도 확대/축소한다.
  // 커서가 가리키는 지점을 중심으로 확대/축소하여 화면의 원하는 부분을 유지한다.
  // 이동 범위는 lightbox의 실제 scrollWidth/scrollHeight로 제한되므로
  // 확대된 이미지의 가장자리까지 빠짐없이 볼 수 있다.
  lb.addEventListener("wheel", e => {
    if (!isOpen()) return;
    e.preventDefault();
    e.stopPropagation();
    zoomBy(e.deltaY < 0 ? 1 : -1, e.clientX, e.clientY);
  }, { passive: false });

  const onMove = e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragged = true;
    lb.scrollLeft = drag.sl - dx;
    lb.scrollTop = drag.st - dy;
  };
  const onUp = () => {
    drag = null;
    window.removeEventListener("mousemove", onMove);
    window.removeEventListener("mouseup", onUp);
  };
  img.addEventListener("mousedown", e => {
    if (!isOpen() || e.button !== 0) return;
    e.preventDefault();
    dragged = false;
    drag = { x: e.clientX, y: e.clientY, sl: lb.scrollLeft, st: lb.scrollTop };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  });

  window.addEventListener("keydown", e => {
    if (!isOpen()) return;
    if (e.key === "Escape") close();
    else if (e.key === "ArrowLeft") { e.preventDefault(); prev(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); next(); }
    else if (e.key === "+" || e.key === "=") { e.preventDefault(); zoomBy(1); }
    else if (e.key === "-" || e.key === "_") { e.preventDefault(); zoomBy(-1); }
  });

  window.addEventListener("resize", () => {
    if (!isOpen()) return;
    calcBaseSize(); applyScale(); updateMeta();
  });

  window.__globalLb = { open, close, isOpen, prev, next, zoomBy };
  return window.__globalLb;
}

async function isDirListDir(dirPathEnc) {
  const IMG_RE = /\.(?:jpg|jpeg|png|webp|gif)$/i;
  const SKIP = /^(?:\?|#|javascript:|mailto:|https?:)/i;
  const files = [], dirs = [];
  try {
    let url = dirPathEnc.endsWith("/") ? dirPathEnc : dirPathEnc + "/";
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) return { ok: false, files, dirs };
    const text = await res.text();

    // 일반 HTML 페이지가 아니라 디렉터리 listing인지 확인.
    if (/function\s+renderDetail|ACTRESSES\s*=|id=["']app["']/i.test(text)) {
      return { ok: false, files, dirs };
    }

    let curPathname = "";
    try {
      const u = new URL(url, window.location.href);
      curPathname = u.pathname.endsWith("/") ? u.pathname : u.pathname + "/";
    } catch (e) { curPathname = url; }

    const doc = new DOMParser().parseFromString(text, "text/html");
    const anchors = Array.from(doc.querySelectorAll("a[href]"));

    for (const a of anchors) {
      const rawHref = a.getAttribute("href") || "";
      if (!rawHref || SKIP.test(rawHref)) continue;

      let name = (a.textContent || "").trim();
      let href = rawHref;
      try { href = decodeURIComponent(href); } catch (e) {}

      // href 기준으로 상대 경로를 계산.
      let absPath = "";
      let isDir = false;
      try {
        const base = new URL(url, window.location.href);
        const u = new URL(rawHref, base);
        isDir = u.pathname.endsWith("/");
        absPath = u.pathname + u.search;
        if (u.hash) absPath += u.hash;
        if (!name || name === "/" || name === "../") {
          name = decodeURIComponent(u.pathname.split("/").filter(Boolean).pop() || "");
        }
        if (isDir && !absPath.endsWith("/")) absPath += "/";
      } catch (e) {
        const clean = href.split(/[?#]/)[0];
        isDir = clean.endsWith("/");
        absPath = url + href;
      }

      if (!name || name === "../" || name === "./") continue;
      name = name.replace(/\/$/, "");
      const sk = (isDir ? "d:" : "f:") + name.toLowerCase();
      if (seenLocal.has(sk)) continue;
      seenLocal.add(sk);

      if (isDir) dirs.push({ name, pathEnc: absPath });
      else if (IMG_RE.test(name)) files.push({ name, src: absPath });
    }
    return { ok: true, files, dirs };
  } catch (e) {
    return { ok: false, files, dirs };
  }

  function seenLocalDummy() {}
}

async function scanImgNode(name, pathEnc, depth) {
  const listing = await isDirListDir(pathEnc);
  if (!listing.ok && depth === 0) return null;
  const node = {
    key: pathEnc.endsWith("/") ? pathEnc : pathEnc + "/",
    name, label: name,
    pathEnc: pathEnc.endsWith("/") ? pathEnc : pathEnc + "/",
    files: (listing.files || []).slice(), children: []
  };
  if (depth < 4) {
    for (const sub of listing.dirs || []) {
      const child = await scanImgNode(sub.name, sub.pathEnc, depth + 1);
      if (child) node.children.push(child);
    }
  }
  return node;
}

function countImgAll(node) {
  if (!node) return 0;
  const direct = Number.isFinite(Number(node._directImgCount))
    ? Number(node._directImgCount)
    : (node._filesLoaded || node._countConfirmed ? (node.files || []).length :
       (Number.isFinite(Number(node.imgCount)) && !(node.children || []).length ? Number(node.imgCount) : 0));
  const childTotal = (node.children || []).reduce((sum, c) => sum + countImgAll(c), 0);
  const total = direct + childTotal;
  node.imgCount = total;
  return total;
}

async function countImagesInDir(pathEnc, depth) {
  const listing = await isDirListDir(pathEnc);
  if (!listing.ok) return 0;
  let n = (listing.files || []).length;
  if (depth < 5) {
    for (const d of listing.dirs || []) n += await countImagesInDir(d.pathEnc, depth + 1);
  }
  return n;
}

async function scanTopFolderIndex(cacheKey, rootLabel, rootPathEnc, useCache) {
  await loadFolderCacheFile();

  if (useCache && FOLDER_CACHE && FOLDER_CACHE[cacheKey] &&
      Array.isArray(FOLDER_CACHE[cacheKey].folders)) {
    const cached = FOLDER_CACHE[cacheKey];
    return {
      fromCache: true, updated: cached.updated || "",
      root: {
        key: rootPathEnc.endsWith("/") ? rootPathEnc : rootPathEnc + "/",
        name: rootLabel, label: rootLabel,
        pathEnc: rootPathEnc.endsWith("/") ? rootPathEnc : rootPathEnc + "/",
        files: [],
        children: cached.folders.map(f => ({
          key: f.pathEnc.endsWith("/") ? f.pathEnc : f.pathEnc + "/",
          name: f.name, label: f.name,
          pathEnc: f.pathEnc.endsWith("/") ? f.pathEnc : f.pathEnc + "/",
          files: [], children: [], imgCount: f.count || 0, _filesLoaded: false
        })),
        imgCount: cached.folders.reduce((s, f) => s + (f.count || 0), 0),
        isRoot: true
      }
    };
  }

  const listing = await isDirListDir(rootPathEnc);
  if (!listing.ok) return { fromCache: false, root: null };

  const children = [];
  const dirs = listing.dirs || [];
  const BATCH = 8;

  for (let i = 0; i < dirs.length; i += BATCH) {
    const slice = dirs.slice(i, i + BATCH);
    const counts = await Promise.all(slice.map(d => countImagesInDir(d.pathEnc, 0)));
    slice.forEach((d, j) => children.push({
      key: d.pathEnc.endsWith("/") ? d.pathEnc : d.pathEnc + "/",
      name: d.name, label: d.name,
      pathEnc: d.pathEnc.endsWith("/") ? d.pathEnc : d.pathEnc + "/",
      files: [], children: [], imgCount: counts[j] || 0, _filesLoaded: false
    }));
  }

  children.sort((a, b) => String(a.name).localeCompare(String(b.name), "ja"));

  const root = {
    key: rootPathEnc.endsWith("/") ? rootPathEnc : rootPathEnc + "/",
    name: rootLabel, label: rootLabel,
    pathEnc: rootPathEnc.endsWith("/") ? rootPathEnc : rootPathEnc + "/",
    files: (listing.files || []).slice(), children,
    imgCount: children.reduce((s, c) => s + (c.imgCount || 0), 0) + (listing.files || []).length,
    isRoot: true
  };

  if (!FOLDER_CACHE) FOLDER_CACHE = {};
  FOLDER_CACHE[cacheKey] = {
    updated: new Date().toISOString().slice(0, 19),
    rootLabel,
    folders: children.map(c => ({ name: c.name, pathEnc: c.pathEnc, count: c.imgCount || 0 }))
  };
  saveFolderCacheLocal();
  return { fromCache: false, root };
}


async function probeImgHasSubfolders(node) {
  if (!node || node.isRoot || node._hasSubfoldersChecked || !node._handle) return !!(node && node._hasSubfolders);
  try {
    // 이 폴더 하나만 확인하고, 첫 번째 하위 디렉터리를 찾는 즉시 종료한다.
    for await (const [, entry] of node._handle.entries()) {
      if (entry.kind === "directory") {
        node._hasSubfolders = true;
        node._hasSubfoldersChecked = true;
        return true;
      }
    }
    node._hasSubfolders = false;
    node._hasSubfoldersChecked = true;
    return false;
  } catch (e) {
    node._hasSubfolders = false;
    node._hasSubfoldersChecked = true;
    return false;
  }
}

async function ensureImgNodeStructureLoaded(node) {
  if (!node) return node;
  if (node._structureLoaded && !node._needsScan) return node;
  if (!node._handle) return node;

  const status = document.getElementById("imgSearchStatus");
  const IMAGE_RE = /\.(?:jpg|jpeg|png|webp|gif|bmp)$/i;
  const entries = [];

  try {
    if (status) status.textContent = tr("folderRead") + " · " + (node.name || "");

    let n = 0;
    for await (const [name, entry] of node._handle.entries()) {
      entries.push([name, entry]);
      if (++n % 250 === 0) {
        if (status) status.textContent =
          "폴더 내용 읽는 중… " + n.toLocaleString() + "개 항목 · " + (node.name || "");
        await new Promise(r => requestAnimationFrame(r));
      }
    }

    entries.sort((a,b) => {
      const ad = a[1].kind === "directory", bd = b[1].kind === "directory";
      if (ad !== bd) return ad ? -1 : 1;
      return a[0].localeCompare(b[0], "ja");
    });

    // 실제 폴더를 다시 읽더라도, 이전에 사용자가 확인해서 메모리에 확정한
    // 하위 폴더의 건수(_countConfirmed)는 절대로 잃지 않는다.
    // 기존 구현은 children=[]로 초기화하면서 이 정보를 버렸고, 이후 JSON 저장 시
    // 캐시의 0이 다시 들어가는 문제가 발생할 수 있었다.
    const previousChildren = new Map((node.children || []).map(c => [String(c.pathEnc || c.key), c]));
    node.files = [];
    node._fileHandles = [];
    node.children = [];

    for (const [name, entry] of entries) {
      if (entry.kind === "directory") {
        const childPath = node.pathEnc
          ? node.pathEnc + name + "/"
          : "./" + name + "/";
        const previous = previousChildren.get(childPath);
        const child = previous || {
          key: childPath,
          name,
          label: name,
          pathEnc: childPath,
          files: [],
          _fileHandles: [],
          children: [],
          isRoot: false,
          _filesLoaded: false,
          _structureLoaded: false,
          _needsScan: true,
          _hasSubfolders: false,
          _hasSubfoldersChecked: false,
          _handle: entry,
          _scanDepth: (node._scanDepth || 0) + 1
        };
        child.key = childPath;
        child.name = name;
        child.label = name;
        child.pathEnc = childPath;
        child._handle = entry;
        // 이전에 실제 확인한 건수/상태는 유지한다.
        if (!previous) {
          child._countConfirmed = false;
          child._filesLoaded = false;
        }
        node.children.push(child);
      } else if (IMAGE_RE.test(name)) {
        node._fileHandles.push({ name, handle: entry });
      }
    }

    node._directImgCount = node._fileHandles.length;
    node._directCountConfirmed = true;
    node.imgCount = node._directImgCount;
    node._countConfirmed = true;
    node._hasSubfolders = node.children.length > 0;
    node._hasSubfoldersChecked = true;
    node._structureLoaded = true;
    // Merge the already saved folder-structure cache into this freshly scanned node.
    const rootCache = FOLDER_CACHE && FOLDER_CACHE[getFolderCacheKey(imgSearchRoot?.name)];
    const cachedNode = rootCache ? findCachedFolder(rootCache.node || rootCache, node.pathEnc) : null;
    if (cachedNode) {
      for (const child of node.children) {
        const cc = (cachedNode.children || []).find(x => String(x.pathEnc || "").replace(/\\/g, "/") === String(child.pathEnc || "").replace(/\\/g, "/"));
        if (cc) {
          // 실제 handle/실제 파일목록은 새로 읽은 값을 우선하고,
          // 아직 읽지 않은 하위 폴더의 캐시 건수/트리는 보존합니다.
          applyCachedNodeInfo(child, cc, true);
          child._handle = child._handle || null;
        }
      }
    }
    node._needsScan = false;
    akSetScanProgress(tr("subfolderReadDone"), (node.name || tr("selectedFolder")) + " · " + tr("subfolderReadDetail"), 100);
    setTimeout(() => akSetScanProgress("", "", 0, true), 500);
    return node;
  } catch (e) {
    console.error("on-demand folder scan failed", e);
    if (status) status.textContent = tr("cannotRead");
    return node;
  }
}


async function refreshImgTreeFileCounts(rootNode) {
  // 클릭/갤러리 표시를 막지 않도록 폴더 개수 스캔은 백그라운드에서 한다.
  // 한 번에 너무 많은 폴더를 읽지 않고, 이미 계산된 노드는 건너뛴다.
  if (!rootNode) return;

  const queue = [rootNode];
  let scanned = 0;
  const MAX_PER_YIELD = 3;

  while (queue.length) {
    for (let n = 0; n < MAX_PER_YIELD && queue.length; n++) {
      const node = queue.shift();
      if (!node) continue;
      try {
        if (!node._structureLoaded || node._needsScan) {
          await ensureImgNodeStructureLoaded(node);
        }
        scanned++;
        (node.children || []).forEach(child => {
          if (child && (child._needsScan || !child._structureLoaded)) queue.push(child);
        });
      } catch (e) {
        console.warn("tree file-count scan failed:", node.name, e);
      }
    }

    countImgAll(rootNode);
    renderImageSearchTree();
    // 브라우저 이벤트/클릭 처리를 충분히 양보한다.
    await new Promise(r => setTimeout(r, 0));
  }

  renderImageSearchTree();
}

async function ensureFolderImagesLoaded(node) {
  if (!node) return node;
  await ensureImgNodeStructureLoaded(node);
  if (node._filesLoaded) return node;

  // 파일 자체는 열지 않고 Handle만 가볍게 레코드로 만든다.
  // 실제 getFile()/ObjectURL은 갤러리에 표시되는 배치에서만 수행한다.
  const handles = node._fileHandles || [];
  node.files = handles.map(h => ({ name: h.name, src: null, file: null, handle: h.handle }));
  node._filesLoaded = true;
  node._directImgCount = node.files.length;
  node._directCountConfirmed = true;
  node.imgCount = node._directImgCount;
  node._countConfirmed = true;
  countImgAll(node);
  return node;
}

async function enrichAllFolderStructures(root, statusEl) {
  if (!root || !Array.isArray(root.children) || !root.children.length) return;
  const kids = root.children, BATCH = 6;
  for (let i = 0; i < kids.length; i += BATCH) {
    const slice = kids.slice(i, i + BATCH);
    if (statusEl) statusEl.textContent = tr("folderExpand") + " " +
      Math.min(i + BATCH, kids.length) + "/" + kids.length;
    await Promise.all(slice.map(async c => {
      if (c._filesLoaded) return;
      const full = await scanImgNode(c.name, c.pathEnc, 0);
      if (full) {
        c.files = full.files || [];
        c.children = full.children || [];
        c._directImgCount = (c.files || []).length;
        c._directCountConfirmed = true;
        c.imgCount = countImgAll(c);
        c._countConfirmed = true;
      }
      c._filesLoaded = true;
    }));
  }
}

function ensureFolderTranslationTip() {

function positionFolderTranslationTip(row) {
  const tip = ensureFolderTranslationTip();
  const r = row.getBoundingClientRect();
  const tw = Math.min(520, Math.max(220, tip.offsetWidth || 320));
  let left = r.left;
  if (left + tw > window.innerWidth - 12) left = Math.max(12, window.innerWidth - tw - 12);
  let top = r.bottom + 8;
  if (top + tip.offsetHeight > window.innerHeight - 12) top = Math.max(12, r.top - tip.offsetHeight - 8);
  tip.style.left = left + "px";
  tip.style.top = top + "px";
}

const COMMON_JP_KO = {
  "子ども": "어린이",
  "子どもの": "어린이의",
  "身体": "신체",
  "所見": "소견",

function localFolderTranslation(text) {
  let out = String(text || "").trim();
  if (!out) return "";
  // 대괄호 안의 태그/고유명사는 유지하고 일반적인 일본어 표현만 치환한다.
  Object.keys(COMMON_JP_KO).sort((a,b)=>b.length-a.length).forEach(jp => {
    out = out.replaceAll(jp, COMMON_JP_KO[jp]);
  });
  return out === text ? "" : out;
}

async function translateFolderNameToKorean(name) {
  const text = String(name || "").trim();
  if (!text) return "";
  if (folderTranslationCache.has(text)) return folderTranslationCache.get(text);
  const local = localFolderTranslation(text);
  if (local) {
    folderTranslationCache.set(text, local);
    return local;
  }
  try {
    const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=ja&tl=ko&dt=t&q=" + encodeURIComponent(text);
    const res = await fetch(url, { cache:"force-cache" });
    if (res.ok) {
      const data = await res.json();
      const translated = Array.isArray(data) && Array.isArray(data[0])
        ? data[0].map(x => Array.isArray(x) ? x[0] : "").filter(Boolean).join("")
        : "";
      if (translated) {
        folderTranslationCache.set(text, translated);
        return translated;
      }
    }
  } catch (e) {
    // 인터넷/번역 서버가 없어도 폴더 목록 자체는 정상 동작한다.
  }
  folderTranslationCache.set(text, text);
  return text;
}

}

function findImgNode(node, key) {
  if (!node) return null;
  if (node.key === key) return node;
  for (const c of node.children || []) {
    const f = findImgNode(c, key);
    if (f) return f;
  }
  return null;
}

if (!window.__imgTreeCollapsed) window.__imgTreeCollapsed = { act: {} };
function isTreeCollapsed(side, key) {
  const map = window.__imgTreeCollapsed[side] || {};
  // Root is open; every subfolder starts collapsed until the user opens it.
  if (key === "__selected_root__") return false;
  return Object.prototype.hasOwnProperty.call(map, key) ? !!map[key] : true;
}
function toggleTreeCollapsed(side, key) {
  if (!window.__imgTreeCollapsed[side]) window.__imgTreeCollapsed[side] = {};
  const current = isTreeCollapsed(side, key);
  window.__imgTreeCollapsed[side][key] = !current;
}

function renderImageSearchTree() {
  initImgFolderSearch();
  const body = document.getElementById("imgSearchTreeBody");
  if (!body) return;
  if (!imgSearchRoot) {
    body.innerHTML = '<div class="tree-empty">' + tr("folderNotSelected") + '<br><span style="font-size:0.75rem">' + tr("chooseBase") + '</span></div>';
    return;
  }

  const favoriteScope = imgSearchRoot;
  const topChildren = (imgSearchRoot.children || []).filter(c =>
    (!imgSearchFavOnly || isFavoriteFilterVisible(c, favoriteScope)) &&
    (!imgSearchFolderFilter || imgFolderHasMatch(c, imgSearchFolderFilter)));
  if (imgSearchFavOnly && topChildren.length === 0) {
    body.innerHTML = '<div class="tree-empty">' + tr("noFavFolders") + '</div>';
    return;
  }

  const frag = document.createDocumentFragment();
  const sel = imgSearchSelectedKey || imgSearchRoot.key;
  const probeTargets = [];

  function makeItem(node, label, count, depth) {
    const key = node.key;
    const hasSub = node.isRoot ? ((node.children || []).length > 0) : node._hasSubfolders === true;
    const collapsed = hasSub && isTreeCollapsed("act", key);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tree-item" + (key === sel ? " active" : "");
    btn.dataset.folderKey = key;
    btn.style.paddingLeft = (6 + depth * 14) + "px";
    const twist = hasSub ? (collapsed ? "▶" : "▼") : "";
    btn.innerHTML = '<span class="tree-twist' + (hasSub ? "" : " is-leaf") +
      '" data-twist="1">' + twist + '</span><span class="tree-ico">📁</span>' +
      '<span class="tree-label" title="' + esc(label) + '">' + esc(label) +
      '</span><span class="tree-count">' + count + '</span>' +
      (node.isRoot ? '' : '<span class="tree-fav-toggle' + (node.favorite ? ' is-favorite' : '') + '" title="즐겨찾기">' + (node.favorite ? '★' : '☆') + '</span>');

    btn.addEventListener("click", async e => {
      if (e.target.closest('.tree-fav-toggle')) {
        e.preventDefault();
        e.stopPropagation();
        toggleImgFolderFavorite(node);
        renderImageSearchTree();
        return;
      }
      e.preventDefault();
      // Selection never waits for a recursive scan.
      if (node.isRoot) {
        // 루트를 실제로 클릭한 경우에만 실제 폴더를 읽어 직접 이미지 건수를 확정합니다.
        if (node._handle && !node._countConfirmed) await ensureImgNodeStructureLoaded(node);
        await selectImgSearchFolder(key);
        renderImageSearchTree();
        return;
      }
      // If this visible folder has not been checked, probe only this folder.
      if (!node._hasSubfoldersChecked) {
        await probeImgHasSubfolders(node);
      }
      if (node._hasSubfolders === true) {
        toggleTreeCollapsed("act", key);
      }
      renderImageSearchTree();
      await selectImgSearchFolder(key);
    });

    // Probe only rows currently rendered. Descendants are not recursively scanned.
    if (!node.isRoot && !node._hasSubfoldersChecked) probeTargets.push({node, btn});
    return btn;
  }

  function walk(node, depth) {
    const filter = imgSearchFolderFilter;
    if (filter && !imgFolderHasMatch(node, filter)) return;
    frag.appendChild(makeItem(node, node.name || node.label, countImgAll(node), depth));
    const forceOpen = !!filter;
    if ((node.children || []).length && (forceOpen || !isTreeCollapsed("act", node.key))) {
      node.children
        .filter(c => !imgSearchFavOnly || isFavoriteFilterVisible(c, favoriteScope))
        .filter(c => !filter || imgFolderHasMatch(c, filter))
        .forEach(c => walk(c, depth + 1));
    }
  }

  const rootNode = {
    key: imgSearchRoot.key,
    name: imgSearchRoot.label,
    label: imgSearchRoot.label,
    children: topChildren,
    isRoot: true
  };
  frag.appendChild(makeItem(rootNode, rootNode.name,
    topChildren.reduce((sum, c) => sum + countImgAll(c), 0), 0));
  if (!isTreeCollapsed("act", imgSearchRoot.key))
    topChildren.forEach(c => walk(c, 1));

  body.innerHTML = "";
  body.appendChild(frag);

  // 하위 폴더 존재 여부는 화면에 실제 보이는 행만 우선 확인한다.
  // 전체 트리를 재귀적으로 훑지 않으며, 각 폴더는 첫 번째 하위 디렉터리를
  // 발견하는 즉시 probeImgHasSubfolders()가 종료한다.
  if (window.__imgTreeProbeObserver) {
    try { window.__imgTreeProbeObserver.disconnect(); } catch(e) {}
  }
  if (typeof IntersectionObserver === "function") {
    window.__imgTreeProbeObserver = new IntersectionObserver(entries => {
      entries.forEach(ent => {
        if (!ent.isIntersecting) return;
        const btn = ent.target;
        const key = btn.dataset.folderKey;
        const node = key ? findImgNode(imgSearchRoot, key) : null;
        if (node && !node.isRoot && !node._hasSubfoldersChecked) {
          probeImgHasSubfolders(node).then(() => {
            if (imgSearchRoot) renderImageSearchTree();
          }).catch(()=>{});
        }
        try { window.__imgTreeProbeObserver.unobserve(btn); } catch(e) {}
      });
    }, {root: body, rootMargin: "160px 0px"});
    body.querySelectorAll('.tree-item').forEach(btn => {
      const key = btn.classList.contains('active') ? btn.dataset.folderKey : btn.dataset.folderKey;
      if (key) window.__imgTreeProbeObserver.observe(btn);
    });
  }

}

async function ensureCachedFolderHandle(key) {
  let node = findImgNode(imgSearchRoot, key);
  if (!node || node.isRoot || node._handle) return node;
  if (!imgSearchRoot?._handle) return node;

  // 캐시 경로를 문자열로만 따라가지 않고, 각 실제 디렉터리를
  // getDirectoryHandle()로 직접 확인합니다. 한글/공백/인코딩 이름도 대응합니다.
  const parts = String(node.pathEnc || key || "")
    .replace(/\\/g, "/")
    .replace(/^\.\//, "")
    .split("/").filter(Boolean);
  const decodePart = part => {
    try { return decodeURIComponent(part); } catch (e) { return part; }
  };

  try {
    let handle = imgSearchRoot._handle;
    let path = "./";
    let current = imgSearchRoot;

    for (const rawPart of parts) {
      const part = decodePart(rawPart);
      handle = await handle.getDirectoryHandle(part, { create: false });
      path += rawPart + "/";

      // 현재 트리의 해당 노드에 실제 handle을 연결합니다.
      let next = (current.children || []).find(c => {
        const cp = String(c.pathEnc || "").replace(/\\/g, "/").replace(/^\.\//, "").replace(/\/$/, "");
        return cp === path.replace(/^\.\//, "").replace(/\/$/, "") ||
               String(c.name || "") === part;
      });
      if (!next) next = findImgNode(imgSearchRoot, path);
      if (!next) next = findImgNode(imgSearchRoot, "./" + rawPart + "/");
      if (!next) return node;
      next._handle = handle;
      current = next;
    }

    node = findImgNode(imgSearchRoot, key) || node;
    if (node._handle) {
      node._needsScan = true;
      node._structureLoaded = false;
      return node;
    }
  } catch (e) {
    console.warn("cached folder handle resolve failed:", node.pathEnc || key, e);
  }
  return node;
}

function getImgFolderDisplayPath(node) {
  if (!node) return "";
  const rootName = imgSearchRoot?.name || window.__imgRootHandle?.name || "";
  const rel = String(node.pathEnc || "./").replace(/^\.\//, "").replace(/\/$/, "");
  return rel ? (rootName ? rootName + "\\" + rel.replace(/\//g, "\\") : rel.replace(/\//g, "\\")) : rootName;
}

function bindCtrlWheelZoom(img, minScale=0.25, maxScale=6) {
  if (!img || img.dataset.ctrlWheelBound === "1") return;
  img.dataset.ctrlWheelBound = "1";
  img.addEventListener("wheel", e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    e.stopPropagation();
    const current = Number(img.dataset.ctrlScale || "1");
    const factor = e.deltaY < 0 ? 1.15 : (1 / 1.15);
    const next = Math.max(minScale, Math.min(maxScale, current * factor));
    img.dataset.ctrlScale = String(next);
    img.style.transform = "scale(" + next + ")";
    img.style.transformOrigin = "center center";
  }, { passive:false });
}

async function showImgFileInMainWindow(rec, index, node) {
  if (!rec || !node) return;
  const key = getImgFileRecordKey(rec, index);
  imgSearchSelectedFileKey = key;
  renderImgFileList();

  const gal = document.getElementById("imgSearchGallery");
  if (!gal) return;

  // 파일보기에서 파일명을 클릭하면 별도 미리보기 1장으로 바꾸지 않고,
  // 현재 이미지 갤러리에서 동일한 파일의 위치로 이동한다.
  // 첫 60장 밖의 파일도 필요한 만큼 백그라운드 배치를 로드한 뒤 이동한다.
  try {
    if (typeof gal.__focusFileIndex === "function") {
      await gal.__focusFileIndex(index);
      return;
    }

    // 갤러리 렌더가 아직 끝나지 않은 경우에는 한 번 다시 렌더링한다.
    await renderImageSearchGallery();
    if (typeof gal.__focusFileIndex === "function") {
      await gal.__focusFileIndex(index);
      return;
    }
  } catch (e) {
    console.warn("image gallery focus failed", e);
  }

  // 최후의 fallback: 현재 DOM에 이미 생성된 동일 파일을 찾아 이동한다.
  const targetKey = key;
  const target = Array.from(gal.querySelectorAll(".inline-gallery-item"))
    .find(it => it.dataset.fileKey === targetKey);
  target?.scrollIntoView({behavior:"smooth", block:"center", inline:"center"});
}

async function selectImgSearchFolder(key) {
  // 이전에 선택한 폴더를 먼저 스캔하지 않는다.
  // 이 동작이 클릭 지연/무반응의 가장 큰 원인이었다.
  imgSearchSelectedKey = key;
  let node = findImgNode(imgSearchRoot, key);
  if (node && !node.isRoot && !node._handle) {
    node = await ensureCachedFolderHandle(key);
  }
  // 캐시에서 복원된 노드는 구조 정보와 실제 handle이 분리되어 있을 수 있습니다.
  // handle 확보에 실패하면 갤러리가 조용히 빈 화면이 되지 않도록 상태를 명확히 표시합니다.
  if (node && !node.isRoot && !node._handle) {
    const st = document.getElementById("imgSearchStatus");
    if (st) st.textContent = tr("folderAccessFail") + " · " + (node.name || "");
    renderImgFileList();
    await renderImageSearchGallery();
    return;
  }
  imgPictureSettings.selectedPath = key || "./";

  const selectedPathLabel = getImgFolderDisplayPath(node);
  const selectedStatus = document.getElementById("imgSearchStatus");
  if (selectedStatus && selectedPathLabel) selectedStatus.textContent = tr("selectPath", {name:selectedPathLabel});
  const rootLabelEl = document.getElementById("imgSearchRootLabel");
  if (rootLabelEl && imgSearchRoot) rootLabelEl.textContent = "📁 " + (imgSearchRoot.name || tr("selectedFolder"));

  renderImageSearchTree();
  if (!node) {
    renderImgFileList();
    return;
  }

  // 선택 폴더만 실제로 읽고 갤러리를 표시한다.
  if (!node.isRoot) await ensureFolderImagesLoaded(node);
  imgSearchSelectedFileKey = "";
  renderImgFileList();
  await renderImageSearchGallery();

  // 변경 내용은 메모리에만 반영한다. JSON 저장은 상단 버튼을 눌렀을 때만 수행한다.
  window.__akSavedFolderPath = node.pathEnc || node.name || key;
}

async function renderImageSearchGallery() {
  const gal = document.getElementById("imgSearchGallery");
  const status = document.getElementById("imgSearchStatus");
  const tabs = document.getElementById("imgSearchOrientTabs");
  if (!gal) return;

  gal.innerHTML = "";
  gal.classList.remove("list-mode");
  gal.style.removeProperty("--list-item-w");


  const node = findImgNode(imgSearchRoot, imgSearchSelectedKey);
  if (!node) { if (status) status.textContent = tr("chooseFolder"); return; }

  // 선택한 폴더 자체의 이미지도 함께 표시할 수 있도록 직접 파일을 먼저 준비한다.
  // 상위 폴더라면 하위 폴더 목록을 먼저 보여주고, 직접 포함된 이미지가 있으면
  // 그 아래에 이미지도 이어서 표시한다. (하위 폴더의 이미지는 중복 표시하지 않는다.)
  if (status) status.textContent = tr("imageListPreparing") + " · " + node.name;
  await ensureFolderImagesLoaded(node);
  renderImageSearchTree();

  const hasChildren = Array.isArray(node.children) && node.children.length > 0;
  const directFiles = (node.files || []).slice();

  if (hasChildren) {
    if (status) status.textContent = tr("subfolderStatus", {n:node.children.length.toLocaleString()}) +
      (directFiles.length ? "직접 이미지 " + directFiles.length.toLocaleString() + "개 · " : "") + (node.name || "");
    tabs?.querySelectorAll(".orient-tab .n").forEach(el => el.textContent = "(0)");
    renderImageFolderList(gal, status, node, imgSearchFavOnly, key => selectImgSearchFolder(key));
    // 직접 이미지가 하나도 없으면 기존처럼 폴더 목록만 표시한다.
    if (!directFiles.length) return;
  }

  // 최하위 폴더는 전체 직접 이미지, 상위 폴더는 그 폴더에 직접 들어 있는 이미지
  // 만 표시한다. 하위 폴더 이미지와 중복되지 않도록 자식의 파일은 합치지 않는다.
  const list = directFiles;

  const useList = imgSearchViewMode === "list";
  gal.classList.toggle("list-mode", useList);
  if (useList) gal.style.setProperty("--list-item-w", imgSearchListSize + "px");


  function updateTabs() {
    const items = gal.querySelectorAll(".inline-gallery-item");
    let all = 0, land = 0, port = 0;
    items.forEach(it => {
      if (it.dataset.removed === "1") return;
      all++;
      if (it.dataset.orient === "portrait") port++; else land++;
    });

    const setN = (k, n) => {
      const el = tabs?.querySelector('[data-orient="' + k + '"] .n');
      if (el) el.textContent = "(" + n + ")";
    };
    setN("all", all); setN("landscape", land); setN("portrait", port);

    let shown = 0;
    items.forEach(it => {
      if (it.dataset.removed === "1") return;
      const ok = imgSearchOrient === "all" || it.dataset.orient === imgSearchOrient;
      it.dataset.hidden = ok ? "0" : "1";
      if (ok) shown++;
      if (!useList && ok) it.style.width = imgSearchThumbSize + "px";
    });

    const label = imgSearchOrient === "landscape" ? tr("orientLandscape") :
      imgSearchOrient === "portrait" ? tr("orientPortrait") : tr("orientAll");
    if (status) {
      status.textContent = !all ? tr("noImage") + " · " + (node.name || "") :
        tr("orientStatus", {label, shown, all}) + " · " +
        (node.name || node.label || "") + (list.length > all ? " · " + tr("scrollLoad") : "") +
        (useList ? tr("listSuffix") : "");
    }
  }

  if (!list.length) {
    if (status) status.textContent = tr("noImage") + " · " + (node.name || "");
    updateTabs();
    return;
  }

  // Object URLs are created only for visible batches.
  const BATCH = 60;
  let cursor = 0;
  let loading = false;
  const lightboxSrc = [];

  const appendBatch = async () => {
    if (loading || cursor >= list.length) return;
    loading = true;

    const end = Math.min(cursor + BATCH, list.length);
    const slice = list.slice(cursor, end);

    // getFile()은 독립 작업이므로 첫 배치를 병렬 준비한다.
    const prepared = await Promise.all(slice.map(async rec => {
      let fileName = rec.name;
      try { fileName = decodeURIComponent(rec.name); } catch (e) {}
      let src = rec.src;
      if (!rec.file && rec.handle) {
        try { rec.file = await rec.handle.getFile(); } catch (e) { return null; }
      }
      if (!src && rec.file) {
        try {
          src = URL.createObjectURL(rec.file);
          rec.src = src;
          if (!window.__imgObjectUrls) window.__imgObjectUrls = [];
          window.__imgObjectUrls.push(src);
        } catch (e) { return null; }
      }
      return src ? { rec, fileName, src } : null;
    }));

    for (let i = 0; i < prepared.length; i++) {
      const data = prepared[i];
      if (!data) continue;
      const { rec, fileName, src } = data;

      const item = document.createElement("div");
      item.className = "inline-gallery-item";
      item.dataset.orient = "landscape";
      item.dataset.index = String(cursor + i);
      item.dataset.fileKey = getImgFileRecordKey(rec, cursor + i);
      if (!useList) item.style.width = (useList ? imgSearchListSize : imgSearchThumbSize) + "px";

      const img = document.createElement("img");
      img.src = src;
      img.alt = fileName;
          img.loading = "lazy";
      img.decoding = "async";

      if (!useList) {
        img.style.width = "100%";
        img.style.height = "auto";
      }

      const lbIndex = lightboxSrc.length;
      lightboxSrc.push(src);
      img.addEventListener("click", () => getGlobalLightbox().open(lightboxSrc, lbIndex));

      // Ctrl + mouse drag: drag upward to zoom in, downward to zoom out.
      // This is intentionally local to the thumbnail image and does not change
      // the persisted thumbnail-size setting.
      let ctrlDrag = null;
      img.addEventListener("mousedown", e => {
        if (!e.ctrlKey || e.button !== 0) return;
        e.preventDefault();
        e.stopPropagation();
        const current = Number(img.dataset.ctrlScale || "1");
        ctrlDrag = { y:e.clientY, scale:current };
        img.classList.add("ak-ctrl-zooming");
        const move = ev => {
          if (!ctrlDrag) return;
          const delta = ctrlDrag.y - ev.clientY;
          const scale = Math.max(0.25, Math.min(6, ctrlDrag.scale * Math.pow(1.006, delta)));
          img.dataset.ctrlScale = String(scale);
          img.style.transform = "scale(" + scale + ")";
          img.style.transformOrigin = "center center";
        };
        const up = () => {
          ctrlDrag = null;
          img.classList.remove("ak-ctrl-zooming");
          window.removeEventListener("mousemove", move);
          window.removeEventListener("mouseup", up);
        };
        window.addEventListener("mousemove", move);
        window.addEventListener("mouseup", up);
      });

      bindCtrlWheelZoom(img);

      img.addEventListener("error", () => {
        item.dataset.removed = "1";
        item.remove();
        updateTabs();
      });

      img.addEventListener("load", () => {
        item.dataset.orient =
          img.naturalWidth >= img.naturalHeight ? "landscape" : "portrait";
        const meta = item.querySelector(".inline-gallery-meta");
        if (meta) meta.textContent = img.naturalWidth + "×" + img.naturalHeight;
        updateTabs();
      });

      const cap = document.createElement("div");
      cap.className = "inline-gallery-caption";
      cap.textContent = fileName;
      item.appendChild(img);
      item.appendChild(cap);

      if (useList) {
        const meta = document.createElement("div");
        meta.className = "inline-gallery-meta";
        meta.textContent = "…";
        item.appendChild(meta);
      }
      gal.appendChild(item);

      if ((i + 1) % 20 === 0) {
        await new Promise(r => requestAnimationFrame(r));
      }
    }

    cursor = end;
    loading = false;
    updateTabs();

    if (cursor >= list.length && status) {
      status.textContent += " · 전체 로드 완료";
    }
  };

  // 파일 목록에서 클릭한 파일의 갤러리 위치로 이동할 수 있도록 공개한다.
  // 필요한 경우 60장 단위로 추가 로드하여 대상 index까지 DOM을 만든다.
  gal.__focusFileIndex = async targetIndex => {
    const n = Math.max(0, Number(targetIndex) || 0);
    let guard = 0;
    while (cursor <= n && cursor < list.length && guard++ < 1000) {
      await appendBatch();
    }
    const targetKey = getImgFileRecordKey(list[n], n);
    const target = Array.from(gal.querySelectorAll(".inline-gallery-item"))
      .find(it => it.dataset.fileKey === targetKey);
    if (target) {
      // 현재 가로/세로 필터에서 숨겨진 경우에도 클릭한 파일이 보이도록 전체로 전환한다.
      if (target.dataset.hidden === "1") {
        imgSearchOrient = "all";
        document.querySelectorAll("#imgSearchOrientTabs .orient-tab").forEach(btn => {
          btn.classList.toggle("active", btn.dataset.orient === "all");
        });
        gal.querySelectorAll(".inline-gallery-item").forEach(it => {
          if (it.dataset.removed !== "1") it.dataset.hidden = "0";
        });
      }

      // 이미지가 아직 로드되지 않은 상태에서는 flex-wrap 레이아웃의 높이가
      // 확정되지 않아 scrollIntoView()가 엉뚱한 위치로 이동할 수 있습니다.
      // 대상 이미지의 로드/디코딩과 레이아웃 2프레임을 기다린 뒤,
      // 갤러리 자체의 scrollTop을 직접 계산하여 정확히 가운데로 이동합니다.
      const targetImg = target.querySelector("img");
      if (targetImg && !targetImg.complete) {
        await new Promise(resolve => {
          let done = false;
          const finish = () => {
            if (done) return;
            done = true;
            targetImg.removeEventListener("load", finish);
            targetImg.removeEventListener("error", finish);
            resolve();
          };
          targetImg.addEventListener("load", finish, {once:true});
          targetImg.addEventListener("error", finish, {once:true});
          setTimeout(finish, 1200);
        });
      }
      if (targetImg && targetImg.decode) {
        try { await targetImg.decode(); } catch (e) {}
      }
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

      const scrollToTarget = () => {
        const gr = gal.getBoundingClientRect();
        const tr = target.getBoundingClientRect();
        const nextTop = gal.scrollTop + (tr.top - gr.top) - (gr.height - tr.height) / 2;
        gal.scrollTo({ top: Math.max(0, nextTop), behavior:"smooth" });
      };
      scrollToTarget();
      // 이미지의 실제 높이가 늦게 확정되는 경우를 대비해 한 번 더 보정합니다.
      setTimeout(scrollToTarget, 180);

      target.classList.add("file-focus-highlight");
      setTimeout(() => target.classList.remove("file-focus-highlight"), 1100);
      return true;
    }
    return false;
  };

  await appendBatch();

  if (cursor < list.length) {
    const sentinel = document.createElement("div");
    sentinel.className = "img-gallery-load-sentinel";
    sentinel.style.cssText = "height:1px;width:100%;";
    gal.appendChild(sentinel);

    if (window.__imgGalleryObserver) {
      try { window.__imgGalleryObserver.disconnect(); } catch (e) {}
    }

    window.__imgGalleryObserver = new IntersectionObserver(async entries => {
      if (entries.some(e => e.isIntersecting)) {
        await appendBatch();
        if (cursor >= list.length) {
          try { window.__imgGalleryObserver.disconnect(); } catch (e) {}
          sentinel.remove();
        }
      }
    }, { root: null, rootMargin: "1200px 0px" });

    window.__imgGalleryObserver.observe(sentinel);
  }

  updateTabs();
}


function restoreImgSavedFolderSelection() {
  const wanted = window.__akSavedFolderPath || "";
  if (!wanted || !imgSearchRoot) return false;

  const node = findImgNode(imgSearchRoot, wanted);
  if (node) {
    imgSearchSelectedKey = node.key;
    return true;
  }

  // Keys can differ slightly between versions; match normalized path.
  const normalize = v => String(v || "").replace(/\\/g, "/").replace(/^\.\//, "").replace(/\/+/g, "/").replace(/\/$/, "");
  const target = normalize(wanted);

  let found = null;
  const walk = n => {
    if (!n || found) return;
    if (normalize(n.pathEnc) === target || normalize(n.key) === target) {
      found = n;
      return;
    }
    (n.children || []).forEach(walk);
  };
  walk(imgSearchRoot);

  if (found) {
    imgSearchSelectedKey = found.key;
    return true;
  }
  return false;
}

function akSetScanProgress(title, detail, pct, hide=false) {
  const box=document.getElementById("akScanProgress"); if(!box) return;
  if(hide){ box.style.display="none"; return; }
  box.style.display="block";
  const t=document.getElementById("akScanProgressTitle"), d=document.getElementById("akScanProgressDetail"), f=document.getElementById("akScanProgressFill");
  if(t) t.textContent=title||"폴더 구조 읽는 중…"; if(d) d.textContent=detail||""; if(f) f.style.width=Math.max(0,Math.min(100,Number(pct)||0))+"%";
}

function buildCachedRootFromHandle(dirHandle, displayName) {
  const rootName = displayName || dirHandle?.name || "선택 폴더";
  const root = {
    key: "__selected_root__", name: rootName, label: rootName, pathEnc: "./",
    files: [], _fileHandles: [], children: [], isRoot: true,
    _filesLoaded: false, _structureLoaded: true, _handle: dirHandle,
    _cachedRoot: true, _needsScan: false
  };
  const cacheKey = getFolderCacheKey(rootName);
  const cached = FOLDER_CACHE && FOLDER_CACHE[cacheKey];
  if (cached) applyCachedNodeInfo(root, cached.node || cached, true);
  // Cached children are placeholders. Attach the real root handle only; child
  // handles are resolved lazily with getDirectoryHandle() when the user opens one.
  root._cacheAvailable = !!cached;
  return root;
}

async function loadRootFromCacheFirst(dirHandle, displayName) {
  imgSearchRoot = buildCachedRootFromHandle(dirHandle, displayName);
  imgSearchSelectedKey = imgSearchRoot.key;
  imgSearchLoaded = true;
  restoreImgSavedFolderSelection();
  const label = document.getElementById("imgSearchRootLabel");
  if (label) label.textContent = "📁 " + imgSearchRoot.name;
  renderImageSearchTree();
  renderImgFileList();
  const status = document.getElementById("imgSearchStatus");
  const cache = imgSearchRoot._cacheAvailable;
  if (status) status.textContent = cache
    ? "캐시 사용 · 폴더 구조와 파일 건수를 즉시 표시 · 필요 시 ReScan"
    : "캐시 정보 없음 · ReScan으로 폴더 정보를 생성하세요";
  akSetScanProgress(cache ? "캐시 로드 완료" : "캐시 정보 없음", cache ? "폴더를 실제로 읽지 않고 act_folder_cache.json을 사용했습니다." : "ReScan을 누르면 폴더 구조와 파일 건수를 새로 조사합니다.", 100);
  setTimeout(() => akSetScanProgress("", "", 0, true), 1200);
  await renderImageSearchGallery();
  return cache;
}

async function rescanImageSearchRoot() {
  const handle = window.__imgRootHandle;
  if (!handle) { showToast(tr("selectBaseFolder")); return; }

  // ReScan은 전체 폴더를 다시 조사하므로 실행 전에 사용자 확인을 받습니다.
  const ok = window.confirm(
    uiLang === "ja" ? "ReScanを実行しますか？\n\n選択したフォルダのすべてのサブフォルダと画像ファイルを再調査します。\nフォルダ数と画像数によって時間がかかる場合があります。" : "ReScan을 실행하시겠습니까?\n\n선택한 폴더의 모든 하위 폴더와 이미지 파일을 다시 조사합니다.\n폴더 수와 이미지 수에 따라 시간이 걸릴 수 있습니다."
  );
  if (!ok) return;

  const btn = document.getElementById("btnImgSearchRescan");
  if (btn) { btn.disabled = true; btn.textContent = tr("rescanBusy"); }
  const started = performance.now();
  const status = document.getElementById("imgSearchStatus");
  const body = document.getElementById("imgSearchTreeBody");
  const IMAGE_RE = /\.(?:jpg|jpeg|png|webp|gif|bmp)$/i;
  let entriesSeen = 0, dirsDone = 0, imageCount = 0;

  const scanDir = async (dirHandle, pathEnc, depth, isRoot=false) => {
    const node = {
      key: isRoot ? "__selected_root__" : pathEnc,
      name: dirHandle.name, label: dirHandle.name, pathEnc,
      files: [], _fileHandles: [], children: [], isRoot,
      _filesLoaded: false, _structureLoaded: true, _handle: dirHandle,
      _scanDepth: depth, _needsScan: false, _hasSubfolders: false,
      _hasSubfoldersChecked: true
    };
    const dirs = [], files = [];
    for await (const [name, entry] of dirHandle.entries()) {
      entriesSeen++;
      if (entry.kind === "directory") dirs.push([name, entry]);
      else if (IMAGE_RE.test(name)) files.push({name, handle: entry});
      if (entriesSeen % 300 === 0) {
        const sec = ((performance.now()-started)/1000).toFixed(1);
        if (status) status.textContent = tr("rescanProgress", {dirs:dirsDone.toLocaleString(),images:imageCount.toLocaleString(),sec});
        akSetScanProgress(tr("scanCheck"), tr("scanCheckDetail", {n:entriesSeen.toLocaleString(),sec}), 0);
        await new Promise(r => requestAnimationFrame(r));
      }
    }
    dirs.sort((a,b)=>a[0].localeCompare(b[0],"ja"));
    files.sort((a,b)=>a.name.localeCompare(b.name,"ja"));
    node._fileHandles = files;
    // 직접 파일 수와 하위 폴더 총 건수를 분리해서 저장합니다.
    // snapshotImgCacheNode()가 상위 폴더를
    // directCount + 모든 자식 count로 정확히 계산할 수 있도록 합니다.
    node._directImgCount = files.length;
    node._directCountConfirmed = true;
    node.imgCount = files.length;
    node._countConfirmed = true;
    node._hasSubfolders = dirs.length > 0;
    node._hasSubfoldersChecked = true;
    imageCount += files.length;
    dirsDone++;
    for (const [name, childHandle] of dirs) {
      const childPath = pathEnc + name + "/";
      const child = await scanDir(childHandle, childPath, depth+1, false);
      node.children.push(child);
    }
    return node;
  };

  try {
    if (status) status.textContent = tr("rescanStarting");
    if (body) body.innerHTML = '<div class="tree-empty">' + tr("rescanTree") + '</div>';
    akSetScanProgress(tr("scanAllStart"), tr("scanAllDetail"), 0);
    const root = await scanDir(handle, "./", 0, true);
    root.name = handle.name; root.label = handle.name;
    root.key = "__selected_root__"; root.pathEnc = "./";
    imgSearchRoot = root;
    imgSearchSelectedKey = root.key;
    imgSearchLoaded = true;
    applyFavoriteStateFromSettings(root);
    const cacheKey = getFolderCacheKey(root.name);
    if (!FOLDER_CACHE) FOLDER_CACHE = {};
    const now = new Date().toISOString();
    FOLDER_CACHE[cacheKey] = { updated: now, rootLabel: root.name, rootPathEnc: "./", node: snapshotImgCacheNode(root) };
    saveFolderCacheLocal();
    renderImageSearchTree();
    renderImgFileList();
    await renderImageSearchGallery();
    const sec = ((performance.now()-started)/1000).toFixed(1);
    if (status) status.textContent = tr("rescanDone", {dirs:dirsDone.toLocaleString(),images:imageCount.toLocaleString(),sec});
    akSetScanProgress(tr("scanDoneTitle"), tr("scanDoneDetail", {sec}), 100);
    // ReScan은 메모리/localStorage만 갱신합니다.
    // 실제 JSON 파일 다운로드는 상단의 'JSON 저장' 버튼을 눌렀을 때만 수행합니다.
    showToast(tr("rescanSaved"));
    setTimeout(() => akSetScanProgress("", "", 0, true), 1800);
  } catch (e) {
    console.error(e);
    if (status) status.textContent = tr("rescanFail", {msg:e.message || e});
    akSetScanProgress(tr("scanFailTitle"), e.message || String(e), 0);
    showToast(tr("rescanFail", {msg:e.message || e}));
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = tr("rescan"); }
  }
}

async function scanSelectedDirectory(dirHandle, displayName) {
  const status = document.getElementById("imgSearchStatus");
  const body = document.getElementById("imgSearchTreeBody");
  if (body) body.innerHTML = '<div class="tree-empty">' + tr("preparingTree") + '</div>';
  if (status) status.textContent = tr("quickScan");
  akSetScanProgress(tr("scanFolder"), tr("scanDetail"), 5);

  const IMAGE_RE = /\.(?:jpg|jpeg|png|webp|gif|bmp)$/i;
  const YIELD_EVERY = 250;

  async function enumerateDirectory(handle, depth, parentPath, scanDescendants) {
    const node = {
      key: parentPath || "./",
      name: handle.name,
      label: handle.name,
      pathEnc: parentPath || "./",
      files: [],
      _fileHandles: [],
      children: [],
      isRoot: depth === 0,
      _filesLoaded: false,
      _structureLoaded: true,
      _scanDepth: depth
    };

    let seen = 0;
    const dirs = [];
    const rootFileHandles = [];

    for await (const [name, entry] of handle.entries()) {
      if (entry.kind === "directory") dirs.push([name, entry]);
      else if (IMAGE_RE.test(name)) rootFileHandles.push({ name, handle: entry });
      seen++;
      if (seen % YIELD_EVERY === 0) {
        if (status) status.textContent = tr("scanProgress", {n:seen.toLocaleString()});
        akSetScanProgress(tr("scanFolder"), tr("treeScanDetail", {n:seen.toLocaleString()}), Math.min(92, 5 + seen % 87));
        await new Promise(r => requestAnimationFrame(r));
      }
    }
    dirs.sort((a, b) => a[0].localeCompare(b[0], "ja"));
    rootFileHandles.sort((a, b) => a.name.localeCompare(b.name, "ja"));

    for (const [name, entry] of dirs) {
      const childPath = parentPath ? parentPath + name + "/" : "./" + name + "/";
      // Root directory only: create lightweight child handles; do not inspect them.
      node.children.push({
        key: childPath,
        name,
        label: name,
        pathEnc: childPath,
        files: [],
        _fileHandles: [],
        children: [],
        isRoot: false,
        _filesLoaded: false,
        _structureLoaded: false,
        _needsScan: true,
        _hasSubfolders: false,
        _hasSubfoldersChecked: false,
        _handle: entry,
        _scanDepth: depth + 1
      });
    }

    node._fileHandles = rootFileHandles;
    node.imgCount = node._fileHandles.length;
    node._countConfirmed = true;
    node._hasSubfolders = node.children.length > 0;
    node._hasSubfoldersChecked = true;
    return node;
  }

  async function releaseObjectUrls() {
    if (window.__imgObjectUrls) {
      window.__imgObjectUrls.forEach(u => {
        try { URL.revokeObjectURL(u); } catch (e) {}
      });
    }
    window.__imgObjectUrls = [];
  }

  try {
    if (window.__imgGalleryObserver) {
      try { window.__imgGalleryObserver.disconnect(); } catch (e) {}
      window.__imgGalleryObserver = null;
    }
    await releaseObjectUrls();

    // Only enumerate the selected root directory.
    // Subfolder contents and image File objects are NOT opened here.
    imgSearchRoot = await enumerateDirectory(dirHandle, 0, "./", false);
    imgSearchRoot.name = displayName || dirHandle.name;
    imgSearchRoot.label = displayName || dirHandle.name;
    imgSearchRoot.key = "__selected_root__";
    imgSearchRoot.pathEnc = "./";
    imgSearchRoot._handle = dirHandle;
    imgSearchRoot._structureLoaded = true;
    imgSearchRoot._filesLoaded = false;
    const rootLabelEl = document.getElementById("imgSearchRootLabel");
    if (rootLabelEl) rootLabelEl.textContent = "📁 " + imgSearchRoot.name;
    const rootStatusEl = document.getElementById("imgSearchStatus");
    if (rootStatusEl) rootStatusEl.textContent = tr("selectPath", {name:imgSearchRoot.name});

    // Use the saved structure cache immediately. The selected root was already
    // enumerated once above, so attach its current direct child handles to cached rows.
    const directHandles = new Map((imgSearchRoot.children || []).map(c => [c.pathEnc, c._handle]).filter(x => x[1]));
    applyFolderCacheToRoot(imgSearchRoot);
    applyFavoriteStateFromSettings(imgSearchRoot);
    for (const child of (imgSearchRoot.children || [])) {
      if (directHandles.has(child.pathEnc)) child._handle = directHandles.get(child.pathEnc);
    }

    imgSearchSelectedKey = imgSearchRoot.key;
    restoreImgSavedFolderSelection();
    imgSearchLoaded = true;

    renderImageSearchTree();
    akSetScanProgress(tr("folderReadDone"), tr("folderReadDoneDetail"), 100);
    setTimeout(() => akSetScanProgress("", "", 0, true), 900);
    await renderImageSearchGallery();

    const directFiles = imgSearchRoot.imgCount || 0;
    const folders = (imgSearchRoot.children || []).length;
    if (status) status.textContent =
      "선택 폴더: " + imgSearchRoot.name +
      " · 즉시 확인 " + directFiles.toLocaleString() + "장" +
      " · 하위 폴더 " + folders.toLocaleString() + "개" +
      " · 이미지 파일은 선택 시 로드";
  } catch (e) {
    imgSearchRoot = null;
    imgSearchSelectedKey = "";
    renderImageSearchTree();
    renderImageSearchGallery();
    if (status) status.textContent = tr("cannotRead");
    showToast(tr("scanFail", {msg:e.message || e}));
  }
}

function matchesImgFolderFilter(node, q) {

function openImgStateDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error("IndexedDB unavailable"));
    const req = indexedDB.open("ak_picture_state_v1", 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error("IndexedDB open failed"));
  });
}

async function saveImgRootHandle(handle) {
  if (!handle) return false;
  try {
    const db = await openImgStateDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").put(handle, "rootHandle");
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
    db.close();
    return true;
  } catch (e) {
    console.warn("root handle save failed", e);
    return false;
  }
}

async function loadImgRootHandle() {
  try {
    const db = await openImgStateDB();
    const handle = await new Promise((resolve, reject) => {
      const tx = db.transaction("kv", "readonly");
      const req = tx.objectStore("kv").get("rootHandle");
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
    db.close();
    return handle;
  } catch (e) {
    return null;
  }
}

async function restoreSavedImgRoot() {
  const handle = await loadImgRootHandle();
  if (!handle) return false;
  try {
    let permission = "granted";
    if (handle.queryPermission) permission = await handle.queryPermission({mode:"read"});
    if (permission !== "granted") return false;
    window.__imgRootHandle = handle;
    await loadRootFromCacheFirst(handle, handle.name);
    return true;
  } catch (e) {
    console.warn("saved root restore failed", e);
    return false;
  }
}

async function readImgPictureSettings() {
  const fallback = { treeWidth: 300, fileListWidth: 45, viewMode: "thumb", thumbSize: 160, listSize: 160, selectedPath: "./", rootFolderName: "", favoriteFolders: {}, uiLang: "ko" };
  imgPictureSettings = { ...fallback };
  imgPictureSettingsWritable = false;

  // IMPORTANT: settings are loaded when the HTML screen opens, not when an image folder is selected.
  // The browser cannot directly read its Downloads folder. Therefore first try a JSON file placed
  // next to the HTML (works when the page is served by a local web server), then use the browser
  // localStorage copy created at the last explicit JSON save as a same-browser fallback.
  let loaded = false;
  try {
    const res = await fetch(IMG_SETTINGS_FILE + "?t=" + Date.now(), { cache: "no-store" });
    if (res.ok) {
      const d = await res.json();
      if (Number.isFinite(Number(d.treeWidth))) imgPictureSettings.treeWidth = Math.max(150, Number(d.treeWidth));
      if (Number.isFinite(Number(d.fileListWidth))) imgPictureSettings.fileListWidth = Math.max(20, Math.min(80, Number(d.fileListWidth)));
      if (d.viewMode === "list" || d.viewMode === "thumb") imgPictureSettings.viewMode = d.viewMode;
      if (Number.isFinite(Number(d.thumbSize))) imgPictureSettings.thumbSize = Math.max(80, Math.min(1000, Number(d.thumbSize)));
      if (Number.isFinite(Number(d.listSize))) imgPictureSettings.listSize = Math.max(80, Math.min(2000, Number(d.listSize)));
      if (typeof d.selectedPath === "string") imgPictureSettings.selectedPath = d.selectedPath;
      if (typeof d.rootFolderName === "string") imgPictureSettings.rootFolderName = d.rootFolderName;
      if (d.uiLang === "ja" || d.uiLang === "ko") { imgPictureSettings.uiLang = d.uiLang; uiLang = d.uiLang; }
      if (d.favoriteFolders && typeof d.favoriteFolders === "object") imgPictureSettings.favoriteFolders = d.favoriteFolders;
      if (d.treeCollapsed && typeof d.treeCollapsed === "object") window.__imgTreeCollapsed = d.treeCollapsed;
      loaded = true;
    }
  } catch (e) {}

  if (!loaded) {
    try {
      const raw = localStorage.getItem("ak_picture_settings_v1");
      if (raw) {
        const d = JSON.parse(raw);
        if (Number.isFinite(Number(d.treeWidth))) imgPictureSettings.treeWidth = Math.max(150, Number(d.treeWidth));
        if (Number.isFinite(Number(d.fileListWidth))) imgPictureSettings.fileListWidth = Math.max(20, Math.min(80, Number(d.fileListWidth)));
        if (d.viewMode === "list" || d.viewMode === "thumb") imgPictureSettings.viewMode = d.viewMode;
      if (Number.isFinite(Number(d.thumbSize))) imgPictureSettings.thumbSize = Math.max(80, Math.min(1000, Number(d.thumbSize)));
      if (Number.isFinite(Number(d.listSize))) imgPictureSettings.listSize = Math.max(80, Math.min(2000, Number(d.listSize)));
        if (typeof d.selectedPath === "string") imgPictureSettings.selectedPath = d.selectedPath;
        if (typeof d.rootFolderName === "string") imgPictureSettings.rootFolderName = d.rootFolderName;
        if (d.treeCollapsed && typeof d.treeCollapsed === "object") window.__imgTreeCollapsed = d.treeCollapsed;
      }
    } catch (e) {}
  }
  window.__akSavedFolderPath = imgPictureSettings.selectedPath || "./";
  return imgPictureSettings;
}
function writeImgPictureSettings(options = {}) {
  // 변경사항은 여기서 물리 파일에 쓰지 않고 메모리 상태(imgPictureSettings)에만 반영한다.
  // 실제 JSON 파일 저장은 상단의 "⬇ JSON 저장" 버튼에서 일괄 처리한다.

function initImgSearchSplitter() {
  const layout = document.querySelector(".image-search-layout");
  const splitter = document.getElementById("imgSearchSplitter");
  const tree = document.getElementById("imgSearchTree");
  if (!layout || !splitter || !tree) return;
  applyImgTreeWidth(imgPictureSettings.treeWidth, false);
  let dragging=false, startX=0, startWidth=300;
  const move = e => { if (!dragging) return; applyImgTreeWidth(startWidth + e.clientX-startX); };
  const up = async () => {
    if (!dragging) return;
    dragging=false; splitter.classList.remove("dragging"); document.body.style.cursor=""; document.body.style.userSelect="";
    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
  };
  splitter.addEventListener("pointerdown", e => {
    e.preventDefault(); dragging=true; startX=e.clientX; startWidth=tree.getBoundingClientRect().width;
    splitter.classList.add("dragging"); document.body.style.cursor="col-resize"; document.body.style.userSelect="none";
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
  });
  window.addEventListener("resize", () => applyImgTreeWidth(imgPictureSettings.treeWidth, false));
}

function initImgFileListSplitter() {

  applyImgFileListWidth(imgPictureSettings.fileListWidth, false);
  let dragging = false, startX = 0, startPaneWidth = 0, totalWidth = 0;
  const move = e => {
    if (!dragging) return;
    const delta = e.clientX - startX;
    const nextPx = Math.max(90, startPaneWidth - delta);
    const pct = Math.max(20, Math.min(80, (nextPx / totalWidth) * 100));
    applyImgFileListWidth(pct, false);
  };
  const up = () => {
    if (!dragging) return;
    dragging = false;
    splitter.classList.remove("dragging");
    document.body.style.cursor = "";
    document.body.style.userSelect = "";
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
  };
  splitter.addEventListener("pointerdown", e => {
    if (!imgSearchFileView) return;
    e.preventDefault();
    dragging = true;
    startX = e.clientX;
    startPaneWidth = pane.getBoundingClientRect().width;
    totalWidth = content.getBoundingClientRect().width;
    splitter.classList.add("dragging");
    document.body.style.cursor = "col-resize";
    document.body.style.userSelect = "none";

    window.addEventListener("pointerup", up);
