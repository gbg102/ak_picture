function initImageSearchUI() {
  getGlobalLightbox();

  const thumbSizeRange = document.getElementById("imgSearchThumbSizeRange");
  const listSizeRange = document.getElementById("imgSearchListSizeRange");
  const btnSelectRoot = document.getElementById("btnImgSearchSelectRoot");
  const btnRescan = document.getElementById("btnImgSearchRescan");
  const folderPicker = document.getElementById("imgSearchFolderPicker");

  btnSelectRoot?.addEventListener("click", selectImageRootFolder);
  btnRescan?.addEventListener("click", rescanImageSearchRoot);

  folderPicker?.addEventListener("change", async e => {
    const files = Array.from(e.target.files || []);
    applyImgTreeWidth(imgPictureSettings.treeWidth, false);
    applyImgViewMode(imgPictureSettings.viewMode, false);
    if (!files.length) return;

    // webkitdirectory fallback: reconstruct a virtual tree from relative paths.
    if (window.__imgObjectUrls) window.__imgObjectUrls.forEach(u => URL.revokeObjectURL(u));
    window.__imgObjectUrls = [];

    const rootName = (files[0].webkitRelativePath || files[0].name).split("/")[0];
    const root = {
      key: "__selected_root__",
      name: rootName,
      label: rootName,
      pathEnc: "./",
      files: [], children: [],
      isRoot: true, _filesLoaded: true
    };

    for (const file of files) {
      if (!/\.(?:jpg|jpeg|png|webp|gif|bmp)$/i.test(file.name)) continue;
      const parts = (file.webkitRelativePath || file.name).split("/");
      parts.shift();
      let node = root;
      for (let i = 0; i < parts.length - 1; i++) {
        const part = parts[i];
        let child = node.children.find(c => c.name === part);
        if (!child) {
          child = {
            key: "__selected_root__/" + parts.slice(0, i + 1).join("/") + "/",
            name: part, label: part, pathEnc: "./",
            files: [], children: [], _filesLoaded: true
          };
          node.children.push(child);
        }
        node = child;
      }
      const url = URL.createObjectURL(file);
      window.__imgObjectUrls.push(url);
      node.files.push({ name: parts[parts.length - 1], src: url, file });
    }

    (function finalize(n) {
      n.children.sort((a,b) => a.name.localeCompare(b.name, "ja"));
      n.children.forEach(finalize);
      n.imgCount = (n.files || []).length +
        n.children.reduce((sum,c) => sum + (c.imgCount || 0), 0);
    })(root);

    imgSearchRoot = root;
    imgSearchSelectedKey = root.key;
    restoreImgSavedFolderSelection();
    imgSearchLoaded = true;
    renderImageSearchTree();
    await renderImageSearchGallery();

    const label = document.getElementById("imgSearchRootLabel");
    if (label) label.textContent = "📁 " + rootName;
    const status = document.getElementById("imgSearchStatus");
    if (status) status.textContent = tr("selectFolderStatus", {name:rootName,n:countImgAll(root)});
  });
  const thumbSizeVal = document.getElementById("imgSearchThumbSizeVal");
  const listSizeVal = document.getElementById("imgSearchListSizeVal");
  const tabs = document.getElementById("imgSearchOrientTabs");
  const btnFav = document.getElementById("btnImgSearchFavOnly");
  const viewModeCombo = document.getElementById("imgSearchViewMode");
  const fileViewToggle = document.getElementById("imgSearchFileView");
  const fileViewPane = document.getElementById("imgSearchFileListPane");

  if (fileViewToggle) {
    try { imgSearchFileView = localStorage.getItem("ak_img_file_view") === "1"; } catch (e) {}
    fileViewToggle.checked = imgSearchFileView;
    fileViewToggle.addEventListener("change", () => {
      imgSearchFileView = !!fileViewToggle.checked;
      try { localStorage.setItem("ak_img_file_view", imgSearchFileView ? "1" : "0"); } catch (e) {}
      renderImgFileList();
      refreshImgFileListSplitter();
    });
  }

  initImgFileListSplitter();
  refreshImgFileListSplitter();
  // JSON에서 썸네일/List 크기를 각각 복원하고, 두 조절바를 독립적으로 운용합니다.
  try {
    const legacy = parseInt(localStorage.getItem("ak_img_search_size") || "160", 10);
    imgSearchThumbSize = Number.isFinite(Number(imgPictureSettings.thumbSize)) ? Number(imgPictureSettings.thumbSize) : (legacy >= 80 && legacy <= 1000 ? legacy : 160);
    imgSearchListSize = Number.isFinite(Number(imgPictureSettings.listSize)) ? Number(imgPictureSettings.listSize) : (legacy >= 80 && legacy <= 1000 ? legacy : 160);
  } catch (e) {
    imgSearchThumbSize = Number(imgPictureSettings.thumbSize) || 160;
    imgSearchListSize = Number(imgPictureSettings.listSize) || 160;
  }
  imgSearchSize = imgSearchViewMode === "list" ? imgSearchListSize : imgSearchThumbSize;
  document.querySelector(".size-thumb-controls")?.classList.toggle("is-hidden", imgSearchViewMode !== "thumb");
  document.querySelector(".size-list-controls")?.classList.toggle("is-hidden", imgSearchViewMode !== "list");

  if (thumbSizeRange) {
    thumbSizeRange.value = imgSearchThumbSize;
    if (thumbSizeVal) thumbSizeVal.textContent = imgSearchThumbSize + "px";
    thumbSizeRange.addEventListener("input", () => {
      imgSearchThumbSize = parseInt(thumbSizeRange.value, 10) || 160;
      imgPictureSettings.thumbSize = imgSearchThumbSize;
      if (imgSearchViewMode !== "list") {
        imgSearchSize = imgSearchThumbSize;
        const gal = document.getElementById("imgSearchGallery");
        gal?.querySelectorAll(".inline-gallery-item").forEach(it => {
          const o = it.dataset.orient || "landscape";
          if (imgSearchOrient === "all" || imgSearchOrient === o) it.style.width = imgSearchThumbSize + "px";
        });
      }
      if (thumbSizeVal) thumbSizeVal.textContent = imgSearchThumbSize + "px";
      try { localStorage.setItem("ak_img_search_thumb_size", String(imgSearchThumbSize)); } catch (e) {}
    });
    thumbSizeRange.addEventListener("dblclick", () => {
      imgSearchThumbSize = 160;
      imgPictureSettings.thumbSize = 160;
      thumbSizeRange.value = 160;
      if (thumbSizeVal) thumbSizeVal.textContent = "160px";
      if (imgSearchViewMode !== "list") { imgSearchSize = 160; renderImageSearchGallery(); }
    });
  }

  if (listSizeRange) {
    listSizeRange.value = imgSearchListSize;
    if (listSizeVal) listSizeVal.textContent = imgSearchListSize + "px";
    listSizeRange.addEventListener("input", () => {
      imgSearchListSize = parseInt(listSizeRange.value, 10) || 160;
      imgPictureSettings.listSize = imgSearchListSize;
      if (imgSearchViewMode === "list") {
        imgSearchSize = imgSearchListSize;
        const gal = document.getElementById("imgSearchGallery");
        gal?.querySelectorAll(".inline-gallery-item").forEach(it => {
          it.style.width = imgSearchListSize + "px";
          it.style.maxWidth = imgSearchListSize + "px";
        });
        gal?.style.setProperty("--list-item-w", imgSearchListSize + "px");
      }
      if (listSizeVal) listSizeVal.textContent = imgSearchListSize + "px";
      try { localStorage.setItem("ak_img_search_list_size", String(imgSearchListSize)); } catch (e) {}
    });
    listSizeRange.addEventListener("dblclick", () => {
      imgSearchListSize = 160;
      imgPictureSettings.listSize = 160;
      listSizeRange.value = 160;
      if (listSizeVal) listSizeVal.textContent = "160px";
      if (imgSearchViewMode === "list") { imgSearchSize = 160; renderImageSearchGallery(); }
    });
  }

  if (tabs) {
    tabs.addEventListener("click", e => {
      const btn = e.target.closest(".orient-tab");
      if (!btn) return;
      imgSearchOrient = btn.dataset.orient || "all";
      tabs.querySelectorAll(".orient-tab").forEach(b => b.classList.toggle("active", b === btn));
      renderImageSearchGallery();
    });
  }

  if (btnFav) {
    btnFav.addEventListener("click", () => {
      imgSearchFavOnly = !imgSearchFavOnly;
      btnFav.classList.toggle("active", imgSearchFavOnly);
      btnFav.textContent = imgSearchFavOnly ? tr("favOnlyOn") : tr("favOnly");
      renderImageSearchTree();
      renderImageSearchGallery();
    });
  }

  if (viewModeCombo) {
    applyImgViewMode(imgPictureSettings.viewMode, false);
    viewModeCombo.querySelectorAll("button[data-mode]").forEach(b => {
      b.addEventListener("click", () => {
        applyImgViewMode(b.dataset.mode, true);
        renderImageSearchGallery();
      });
    });

    viewModeCombo.addEventListener("wheel", e => {
      if (imgSearchViewMode !== "list") return;
      e.preventDefault();
      imgSearchListScale = Math.min(1.4, Math.max(0.5,
        imgSearchListScale * (e.deltaY < 0 ? 1.08 : 1 / 1.08)));
      renderImageSearchGallery();
    }, { passive: false });
  }

}

document.addEventListener("DOMContentLoaded", async () => {
  // Local web-server mode: load the shared JSON beside the HTML BEFORE building the screen.
  await readImgPictureSettings();
  await loadFolderCacheFile();
  applyImgSettingsAfterRootSelection();
  initImageSearchUI();
  initImgSearchSplitter();

  // 초기 레이아웃 계산이 끝난 뒤 JSON에서 읽은 treeWidth를 한 번 더 적용한다.
  // 첫 실행에서도 기본값 300px으로 보이는 순간을 방지한다.
  requestAnimationFrame(() => {
    applyImgTreeWidth(imgPictureSettings.treeWidth, false);
  });

  const restored = await restoreSavedImgRoot();
  if (!restored) await scanImageSearchRoot();
  document.getElementById("btnLangToggle")?.addEventListener("click", toggleUiLanguage);
  updateUiLanguage();
});

document.getElementById("btnCacheDownload")?.addEventListener("click", async (e) => {
  e.preventDefault();
  await downloadFolderCacheFile();
});


</script>
</body>
</html>
